<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Кейс-задача №3</title>

  <!-- Подключение файла стилей -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Основной контейнер слайдера -->
  <div class="slider">

    <!-- Область отображения текущего изображения -->
    <img id="slide" src="img/1.jpg" alt="Слайд">

    <!-- Блок с кнопками управления -->
    <div class="controls">
      <button id="prev">Назад</button>
      <button id="next">Вперед</button>
    </div>

    <!-- Текстовый индикатор текущего номера изображения -->
    <p id="counter">Изображение 1 из 5</p>
  </div>

  <!-- Подключение JavaScript-файла -->
  <script src="script.js"></script>
</body>

</html>
